# docker compose up --build                     # the single image: http://localhost:8090 (OpenTripPlanner inside)
# docker compose --profile build run --rm pipeline   # rebuild the model into ./data/out/full, then rebuild the image
# CROWD_CLOCK=replay docker compose up -d && docker compose --profile replay run --rm replay
services:
  crowding:
    build: .
    image: delhi-transport-crowding
    ports: ["8090:8090"]
    environment:
      CROWD_CLOCK: "${CROWD_CLOCK:-wall}"
      # "rule" (default) or "trees" (the opt-in machine-learning live model).
      LIVE_MODEL: "${LIVE_MODEL:-rule}"
      # Live bus positions: the key comes from the shell or .env, never from the image.
      DTS_API_KEY: "${DTS_API_KEY:-}"

  pipeline:
    image: delhi-transport-crowding
    profiles: ["build"]
    volumes: ["./data:/data"]
    entrypoint: ["crowd-pipeline"]
    command:
      - --config=/app/config/model.dhall
      - --gtfs=/data/raw/gtfs/delhi-bus
      - --tickets=/data/raw/tickets/October-Delhi.csv
      - --out=/data/out/full
      - --rt=/data/raw/rt

  replay:
    image: delhi-transport-crowding
    profiles: ["replay"]
    volumes: ["./data:/data:ro"]
    entrypoint: ["crowd-replay"]
    command:
      - --tickets=/data/raw/tickets/October-Delhi.csv
      - --date=2026-10-28
      - --from=07:00
      - --speed=120
      - --url=http://crowding:8090
