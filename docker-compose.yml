# docker compose run --rm pipeline   # build the crowding model into ./data/out/full
# docker compose up crowd-service    # API + web app on http://localhost:8090
# docker compose --profile otp up    # also the patched OpenTripPlanner with the Delhi graph
services:
  pipeline:
    build: .
    profiles: ["build"]
    volumes: ["./data:/data"]
    command:
      - crowd-pipeline
      - --config=/app/config/model.dhall
      - --gtfs=/data/raw/gtfs/delhi-bus
      - --tickets=/data/raw/tickets/October-Delhi.csv
      - --out=/data/out/full
      - --rt=/data/raw/rt

  crowd-service:
    build: .
    ports: ["8090:8090"]
    volumes: ["./data:/data:ro"]
    environment:
      CROWD_CLOCK: replay
      OTP_ENABLED: "${OTP_ENABLED:-False}"
      # Live bus positions: the key comes from the shell or .env, never from a file in the image.
      DTS_API_KEY: "${DTS_API_KEY:-}"
      OTP_GRAPHQL_URL: http://otp:8080/otp/gtfs/v1

  otp:
    profiles: ["otp"]
    build:
      context: .
      dockerfile: otp-crowding/Dockerfile
    ports: ["8080:8080"]
    environment:
      OTP_CROWDING_INDEX_URL: http://crowd-service:8090/v1/otp/crowding-index
    depends_on: [crowd-service]

  replay:
    build: .
    profiles: ["replay"]
    volumes: ["./data:/data:ro"]
    command:
      - crowd-replay
      - --tickets=/data/raw/tickets/October-Delhi.csv
      - --date=2026-10-28
      - --from=07:00
      - --speed=120
      - --url=http://crowd-service:8090
    depends_on: [crowd-service]
