[workspace]
resolver = "2"
members = [
    "crates/crowd-core",
    "crates/crowd-pipeline",
    "crates/crowd-service",
    "crates/crowd-replay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_dhall = "0.12"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rayon = "1.10"
rustc-hash = "2"
rmp-serde = "1.3"
zstd = "0.13"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
debug = 1
