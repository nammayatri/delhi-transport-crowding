[project]
name = "delhi-bus-crowding-analysis"
version = "0.1.0"
description = "Validation of the Delhi bus crowding model: data audit, known-pattern checks, stability, sensitivity and coverage."
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.1",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
# ARIMA and the pretrained Chronos models in the live-adjustment backtest.
forecast = ["statsmodels==0.15.0", "pandas==3.1.1", "torch==2.15.0", "chronos-forecasting==2.3.2"]

[tool.ruff]
line-length = 120
